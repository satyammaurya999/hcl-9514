#debug=true
logging.pattern.console=%green(%d{HH:mm:ss}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.application.name=jwtdemo
#spring.datasource.url=jdbc:h2:mem:jwtdemo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/jwtdemo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
#spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000